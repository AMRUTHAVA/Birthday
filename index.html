<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Best Friend ❤️</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap"
    rel="stylesheet">

  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>

<body>

  <!-- Background Hearts -->
  <div class="hearts"></div>

  <!-- Intro Section -->
  <section class="hero">

    <h1 class="main-title">
      For Someone Very Special ❤️
    </h1>

    <p class="typing-text"></p>

    <button class="enter-btn" onclick="showSurprise()">
      Enter My Heart ✨
    </button>

  </section>

  <!-- Hidden Surprise Section -->
  <section class="surprise-section" id="surpriseSection">

    <h2 data-aos="fade-up">
      Welcome To Our Memories 🌸
    </h2>

    <div class="cards">

      <div class="card" data-aos="zoom-in" onclick="window.location.href='pages/letter.html'">
        💌
        <span>A Letter For You</span>

      </div>

      <div class="card" data-aos="zoom-in" onclick="window.location.href='pages/quiz.html'">

        🧠
        <span>Friendship Quiz</span>

      </div>

      <div class="card" data-aos="zoom-in" onclick="window.location.href='pages/birthday.html'">

        🎂
        <span>Birthday Surprise</span>

      </div>

      <div class="card" data-aos="zoom-in" onclick="window.location.href='pages/memory.html'">

        📸
        <span>Our Memories</span>

      </div>

    </div>

  </section>

  <!-- Music -->
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <!-- JS -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="script.js"></script>

</body>

</html>
