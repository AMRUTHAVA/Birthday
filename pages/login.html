<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login ❤️</title>

<link rel="stylesheet" href="login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-card">

<h1>💖 Welcome 💖</h1>

<p>
This little world was made only for one special person...
</p>

<input
id="username"
type="text"
placeholder="Your Name">

<input
id="password"
type="password"
placeholder="Secret Password">

<button onclick="login()">
Enter ❤️
</button>

<p id="error"></p>

</div>

<script>
for(let i=0;i<30;i++){

    const h=document.createElement("div");

    h.className="heart";

    h.innerHTML="💖";

    h.style.left=Math.random()*100+"vw";

    h.style.animationDuration=5+Math.random()*6+"s";

    h.style.fontSize=15+Math.random()*25+"px";

    document.body.appendChild(h);

}
</script>

<script src="login.js"></script>

</body>
</html>
