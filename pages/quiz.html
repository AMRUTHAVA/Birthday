<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Friendship Quiz ❤️</title>

  <link rel="stylesheet" href="quiz.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="stars"></div>

<div class="quiz-container">

    <h1>Friendship Quiz ❤️</h1>

    <div class="quiz-box">

        <h2 id="question"></h2>

        <div class="options">

            <button onclick="checkAnswer(0)" id="btn0"></button>

            <button onclick="checkAnswer(1)" id="btn1"></button>

            <button onclick="checkAnswer(2)" id="btn2"></button>

            <button onclick="checkAnswer(3)" id="btn3"></button>

        </div>

    </div>

    <div id="result"></div>

</div>

<script src="quiz.js"></script>

</body>
</html>
